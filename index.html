<!doctype html>
<html lang="en" data-theme="graphite">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title data-default>Patchbay</title>
    <meta
      data-default
      name="description"
      content="A developer toolbox that runs entirely in your browser. Nothing you paste ever leaves the page."
    />
    <link data-default rel="canonical" href="%VITE_SITE_URL%/" />

    <meta data-default property="og:type" content="website" />
    <meta data-default property="og:site_name" content="Patchbay" />
    <meta data-default property="og:locale" content="en" />
    <meta data-default property="og:url" content="%VITE_SITE_URL%/" />
    <meta data-default property="og:title" content="Patchbay" />
    <meta
      data-default
      property="og:description"
      content="A developer toolbox that runs entirely in your browser. Nothing you paste ever leaves the page."
    />
    <meta data-default property="og:image" content="%VITE_SITE_URL%/social-preview.png" />
    <meta data-default property="og:image:width" content="1200" />
    <meta data-default property="og:image:height" content="630" />
    <meta
      data-default
      property="og:image:alt"
      content="The Patchbay wordmark over a wired node graph, in the graphite theme."
    />

    <meta data-default name="twitter:card" content="summary_large_image" />
    <meta data-default name="twitter:title" content="Patchbay" />
    <meta
      data-default
      name="twitter:description"
      content="A developer toolbox that runs entirely in your browser. Nothing you paste ever leaves the page."
    />
    <meta data-default name="twitter:image" content="%VITE_SITE_URL%/social-preview.png" />

    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111419" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfaf7" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link
      rel="preload"
      href="/fonts/ibm-plex-mono-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <script>
      (function () {
        var root = document.documentElement;
        var theme = null;
        try {
          var stored = window.localStorage.getItem('patchbay:theme:v1');
          if (stored) {
            var state = JSON.parse(stored);
            var selection = state && state.selection;
            if (selection && selection.kind === 'preset') {
              theme = selection.name;
            } else if (selection && selection.kind === 'custom') {
              var list = state.customThemes || [];
              for (var i = 0; i < list.length; i++) {
                if (list[i] && list[i].id === selection.id) theme = list[i].base;
              }
            }
          }
        } catch (error) {
          theme = null;
        }
        if (!theme) {
          var light = window.matchMedia('(prefers-color-scheme: light)').matches;
          theme = light ? 'vellum' : 'graphite';
        }
        root.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
