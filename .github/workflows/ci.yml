name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch instead of paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # pnpm must be installed before setup-node, so that setup-node can find
      # the pnpm store to cache.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # --frozen-lockfile fails the build if pnpm-lock.yaml does not match
      # package.json, rather than silently resolving different versions than
      # the ones that were reviewed.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Fails if the initial (non-lazy) JS payload grows past its budget, so a
      # tool or a heavy dependency cannot drift into the entry chunk unnoticed.
      - name: Check bundle budget
        run: pnpm bundle:check
